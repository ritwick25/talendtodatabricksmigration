bundle:
  name: migration-dashboard

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  files_path:
    description: Volume path for file storage (e.g. /Volumes/catalog/schema/volume_name)

resources:
  apps:
    app:
      name: "migration-dashboard"
      description: "Control panel for the Talend-to-Databricks migration system"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - files.files

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: files
          uc_securable:
            securable_full_name: ${var.files_path}
            securable_type: VOLUME
            permission: WRITE_VOLUME

targets:
  default:
    default: true
    workspace:
      host: https://adb-7405617014325769.9.azuredatabricks.net

    variables:
      sql_warehouse_id: b66dc27ad9f891a7
      files_path: talend_migration.samples.talend_export
