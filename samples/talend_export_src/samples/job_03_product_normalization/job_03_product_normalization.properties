  <id>job_03_product_normalization</id>
  <label>Product Catalog Normalization</label>
  <purpose>Synthetic Talend job export generated for a migration-system test-bed. Never opened in real Talend Studio.</purpose>
  <description>Unites two supplier product feeds (tUnite), replicates the merged flow (tReplicate) into a normalize branch (tNormalize splits pipe-delimited tags into one row each, feeding a STRING-HEAVY Java block) and a denormalize branch (tDenormalize regroups tags back together).</description>
  <status>FOR_MIGRATION_TESTING</status>
  <version>0.1</version>
  <author>migration-testbed@synthetic.local</author>
  <jobType>STANDARD</jobType>
  <contextGroup>None</contextGroup>
</property>
