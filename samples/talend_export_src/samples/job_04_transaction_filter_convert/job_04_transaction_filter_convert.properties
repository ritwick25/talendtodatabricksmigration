<property>
  <id>job_04_transaction_filter_convert</id>
  <label>Transaction Log Filter &amp; Convert</label>
  <purpose>Synthetic Talend job export generated for a migration-system test-bed. Never opened in real Talend Studio.</purpose>
  <description>Extracts pipe-delimited transaction fields from raw log lines via regex, filters on status, converts the amount to BigDecimal, and runs a DATE/TIME Java block (multi-pattern parsing, leap-year and month-end statement-cutoff logic) before inserting into transactions_clean.</description>
  <status>FOR_MIGRATION_TESTING</status>
  <version>0.1</version>
  <author>migration-testbed@synthetic.local</author>
  <jobType>STANDARD</jobType>
  <contextGroup>None</contextGroup>
</property>
