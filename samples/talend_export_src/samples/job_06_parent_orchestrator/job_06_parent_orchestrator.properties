<property>
  <id>job_06_parent_orchestrator</id>
  <label>Parent Orchestrator</label>
  <purpose>Synthetic Talend job export generated for a migration-system test-bed. Never opened in real Talend Studio.</purpose>
  <description>Top of a tRunJob chain (parent -&gt; child -&gt; grandchild). Runs a tPrejob marker, stamps a batchRunId into globalMap, calls job_07_child_validation propagating customer_batch_id via context, and wires ON_SUBJOB_OK/ON_SUBJOB_ERROR triggers to tPostjob / tDie.</description>
  <status>FOR_MIGRATION_TESTING</status>
  <version>0.1</version>
  <author>migration-testbed@synthetic.local</author>
  <jobType>STANDARD</jobType>
  <contextGroup>Migration_Context</contextGroup>
</property>
