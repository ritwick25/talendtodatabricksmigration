<?xml version="1.0" encoding="UTF-8"?>
<property>
  <id>job_10_file_iteration</id>
  <label>Incoming File Iteration</label>
  <purpose>Synthetic Talend job export generated for a migration-system test-bed. Never opened in real Talend Studio.</purpose>
  <description>Iterates incoming CSV files with tFileList (globalMap CURRENT_FILEPATH convention), reads each with tFileInputDelimited, converts a row flow to an iteration with tFlowToIterate, and separately loops a hardcoded region-code list with tForeach, accumulating counts via globalMap.</description>
  <status>FOR_MIGRATION_TESTING</status>
  <version>0.1</version>
  <author>migration-testbed@synthetic.local</author>
  <jobType>STANDARD</jobType>
  <contextGroup>Migration_Context</contextGroup>
</property>
